<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#07000f; color:#fff; font-family:'Barlow Condensed',sans-serif; overflow:hidden; position:relative; }

  /* ── Background layers ───────────────────────────────────────── */
  .photo-wrap {
    position:absolute; inset:0; z-index:0;
  }
  .photo-wrap img {
    width:100%; height:100%; object-fit:cover; object-position:top center;
    opacity:0.72;
  }
  /* Dark fade from bottom — keeps text readable */
  .photo-fade {
    position:absolute; inset:0;
    background:linear-gradient(to top,
      #07000f 36%,
      rgba(7,0,15,0.78) 55%,
      rgba(7,0,15,0.30) 76%,
      rgba(7,0,15,0.06) 100%
    );
    z-index:1;
  }
  /* Fallback glow when no photo */
  .bg-glow {
    position:absolute; top:8%; left:50%; transform:translateX(-50%);
    width:1100px; height:900px;
    background:radial-gradient(ellipse, rgba(94,23,235,0.22) 0%, transparent 65%);
    z-index:0;
  }
  .bg-scanlines {
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
    z-index:2;
  }
  .top-bar {
    position:absolute; top:0; left:0; right:0; height:8px; z-index:20;
    background:linear-gradient(to right, #5e17eb, #8c52ff, #f5a623);
  }

  /* ── Brand chrome ─────────────────────────────────────────────── */
  .brand {
    position:absolute; top:38px; left:80px; z-index:20;
    font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:6px;
    color:rgba(255,255,255,0.45);
  }
  .badge {
    position:absolute; top:30px; right:80px; z-index:20;
    display:flex; align-items:center; gap:10px;
    background:rgba(245,166,35,0.14); border:1.5px solid rgba(245,166,35,0.45);
    border-radius:100px; padding:10px 26px;
  }
  .badge-dot  { width:8px; height:8px; border-radius:50%; background:#f5a623; }
  .badge-text { font-size:18px; font-weight:700; letter-spacing:4px; color:#f5a623; text-transform:uppercase; white-space:nowrap; }

  /* ── Content — pinned to bottom ───────────────────────────────── */
  .content {
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    padding:0 80px 80px;
  }

  .eyebrow {
    font-size:19px; font-weight:700; letter-spacing:10px;
    color:rgba(255,255,255,0.40); text-transform:uppercase; margin-bottom:14px;
  }
  .title-r1 {
    font-family:'Bebas Neue',sans-serif; font-size:168px; line-height:0.84;
    color:rgba(255,255,255,0.90); letter-spacing:6px;
  }
  .title-recap {
    font-family:'Bebas Neue',sans-serif; font-size:220px; line-height:0.84;
    color:#f5a623; letter-spacing:6px; margin-bottom:50px;
  }
  .neon-rule {
    width:160px; height:4px;
    background:linear-gradient(90deg, #f5a623, rgba(245,166,35,0));
    border-radius:2px; margin-bottom:48px;
  }

  /* ── Series result row ────────────────────────────────────────── */
  .result-row {
    display:flex; align-items:center; gap:24px; margin-bottom:52px;
  }
  .team-logo  { width:68px; height:68px; object-fit:contain; }
  .team-code  { font-family:'Bebas Neue',sans-serif; font-size:54px; letter-spacing:3px; }
  .team-code.winner { color:#fff; }
  .team-code.loser  { color:rgba(255,255,255,0.35); }
  .def-label  {
    font-family:'Bebas Neue',sans-serif; font-size:40px; letter-spacing:4px;
    color:rgba(255,255,255,0.30); padding:0 4px;
  }
  .result-score {
    font-family:'Bebas Neue',sans-serif; font-size:80px; letter-spacing:2px;
    color:#f5a623; margin-left:8px;
  }

  .footer-brand {
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:6px;
    color:rgba(255,255,255,0.18);
  }
</style>
</head>
<body>
<div class="top-bar"></div>

{% if player_photo %}
  <div class="photo-wrap"><img src="{{ player_photo }}" alt="{{ winner_code }}"></div>
  <div class="photo-fade"></div>
{% else %}
  <div class="bg-glow"></div>
{% endif %}
<div class="bg-scanlines"></div>

<div class="brand">BTN</div>
<div class="badge">
  <div class="badge-dot"></div>
  <div class="badge-text">{{ badge_label }}</div>
</div>

<div class="content">
  <div class="eyebrow">PWHL · Season 8 · 2025–26</div>
  <div class="title-r1">ROUND 1</div>
  <div class="title-recap">RECAP</div>
  <div class="neon-rule"></div>

  <div class="result-row">
    <img class="team-logo" src="{{ logo_winner }}" alt="{{ winner_code }}">
    <div class="team-code winner">{{ winner_code }}</div>
    <div class="def-label">DEF.</div>
    <div class="team-code loser">{{ loser_code }}</div>
    <img class="team-logo" src="{{ logo_loser }}" alt="{{ loser_code }}" style="opacity:0.45;">
    <div class="def-label" style="margin-left:8px;">·</div>
    <div class="result-score">{{ result }}</div>
  </div>

  <div class="footer-brand">BY THE NUMBERS</div>
</div>
</body>
</html>
