<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#07000f; color:#fff; font-family:'Barlow Condensed',sans-serif; overflow:hidden; position:relative; }

  /* ── Background ───────────────────────────────────────────────── */
  .top-bar { position:absolute; top:0; left:0; right:0; height:8px; z-index:5; background:linear-gradient(to right,#5e17eb,#8c52ff,#f5a623); }
  .bg-glow {
    position:absolute; top:12%; left:50%; transform:translateX(-50%);
    width:1100px; height:700px;
    background:radial-gradient(ellipse, rgba(94,23,235,0.18) 0%, transparent 65%);
    z-index:0;
  }
  .bg-scanlines {
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
    z-index:1;
  }

  /* ── Chrome ───────────────────────────────────────────────────── */
  .brand {
    position:absolute; top:38px; left:80px; z-index:10;
    font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:6px;
    color:rgba(255,255,255,0.28);
  }
  .badge {
    position:absolute; top:30px; right:80px; z-index:10;
    display:flex; align-items:center; gap:10px;
    background:rgba(245,166,35,0.14); border:1.5px solid rgba(245,166,35,0.45);
    border-radius:100px; padding:10px 26px;
  }
  .badge-dot  { width:8px; height:8px; border-radius:50%; background:#f5a623; }
  .badge-text { font-size:18px; font-weight:700; letter-spacing:4px; color:#f5a623; text-transform:uppercase; white-space:nowrap; }

  /* ── Slide layout ─────────────────────────────────────────────── */
  .slide {
    position:relative; z-index:2;
    width:1080px; height:1920px;
    display:flex; flex-direction:column;
    padding:118px 72px 72px;
  }

  /* ── Header ───────────────────────────────────────────────────── */
  .header-row {
    display:flex; align-items:center; gap:20px; margin-bottom:12px;
  }
  .h-logo { width:50px; height:50px; object-fit:contain; }
  .h-vs   {
    font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:4px;
    color:rgba(255,255,255,0.22);
  }
  .eyebrow {
    font-size:16px; font-weight:700; letter-spacing:8px;
    color:rgba(255,255,255,0.30); text-transform:uppercase; margin-bottom:4px;
  }
  .title {
    font-family:'Bebas Neue',sans-serif; font-size:104px; line-height:0.88;
    color:#fff; letter-spacing:3px; margin-bottom:6px;
  }
  .result-line {
    display:flex; align-items:center; gap:14px;
  }
  .result-win {
    font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:4px;
    color:#f5a623;
  }
  .result-series {
    font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:3px;
    color:rgba(255,255,255,0.30);
  }
  .neon-rule {
    width:120px; height:3px;
    background:linear-gradient(90deg, #f5a623, rgba(245,166,35,0));
    border-radius:2px; margin:22px 0 32px;
  }

  /* ── Bullet cards ─────────────────────────────────────────────── */
  .bullet-card {
    display:flex; align-items:flex-start; gap:24px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:16px; padding:26px 28px; margin-bottom:20px;
  }
  .bullet-card.lead {
    border-color:rgba(245,166,35,0.28);
    background:rgba(245,166,35,0.04);
  }

  .num-badge {
    display:flex; align-items:center; justify-content:center;
    width:54px; height:54px; border-radius:50%; flex-shrink:0; margin-top:8px;
    background:rgba(140,82,255,0.15); border:1.5px solid rgba(140,82,255,0.35);
    font-family:'Bebas Neue',sans-serif; font-size:28px; color:#8c52ff;
  }
  .num-badge.gold {
    background:rgba(245,166,35,0.15); border-color:rgba(245,166,35,0.42);
    color:#f5a623;
  }

  .bullet-body { flex:1; min-width:0; }
  .bullet-stat {
    font-family:'Bebas Neue',sans-serif; font-size:68px; line-height:1;
    color:#f5a623; letter-spacing:2px;
  }
  .bullet-label {
    font-size:16px; font-weight:700; letter-spacing:4px;
    color:rgba(255,255,255,0.42); text-transform:uppercase; margin-top:4px;
  }
  .bullet-detail {
    font-size:23px; font-weight:600; line-height:1.32;
    color:rgba(255,255,255,0.80); margin-top:10px;
  }

  /* ── Footer ───────────────────────────────────────────────────── */
  .spacer { flex:1; min-height:16px; }
  .footer {
    display:flex; justify-content:space-between; align-items:center;
    padding-top:14px; border-top:1px solid rgba(255,255,255,0.06);
  }
  .footer-brand  { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:4px; color:rgba(255,255,255,0.12); }
  .footer-season { font-size:14px; font-weight:600; letter-spacing:3px; color:rgba(255,255,255,0.12); text-transform:uppercase; }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="bg-glow"></div>
<div class="bg-scanlines"></div>
<div class="brand">BTN</div>
<div class="badge"><div class="badge-dot"></div><div class="badge-text">{{ badge_label }}</div></div>

<div class="slide">

  <!-- Header -->
  <div class="header-row">
    <img class="h-logo" src="{{ logo_winner }}" alt="{{ winner_code }}">
    <div class="h-vs">vs</div>
    <img class="h-logo" src="{{ logo_loser }}" alt="{{ loser_code }}" style="opacity:0.45;">
  </div>
  <div class="eyebrow">2025&#x2013;26 PWHL Playoffs</div>
  <div class="title">BY THE<br>NUMBERS</div>
  <div class="result-line">
    <div class="result-win">{{ winner_code }} WIN</div>
    <div class="result-series">· {{ result }} · {{ n_games }}-GAME SERIES</div>
  </div>
  <div class="neon-rule"></div>

  <!-- Bullets -->
  {% for b in bullets %}
  <div class="bullet-card {% if loop.first %}lead{% endif %}">
    <div class="num-badge {% if loop.first %}gold{% endif %}">{{ b.number }}</div>
    <div class="bullet-body">
      <div class="bullet-stat">{{ b.stat }}</div>
      <div class="bullet-label">{{ b.label }}</div>
      <div class="bullet-detail">{{ b.detail }}</div>
    </div>
  </div>
  {% endfor %}

  <div class="spacer"></div>
  <div class="footer">
    <div class="footer-brand">BY THE NUMBERS</div>
    <div class="footer-season">Season 8 &#xB7; 2025&#x2013;26</div>
  </div>
</div>
</body>
</html>
