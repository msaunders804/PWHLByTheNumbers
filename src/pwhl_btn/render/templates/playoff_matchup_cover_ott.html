<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#07000f; color:#fff; font-family:'Barlow Condensed',sans-serif; overflow:hidden; position:relative; }

  .top-bar { position:absolute; top:0; left:0; right:0; height:8px; z-index:5; background:linear-gradient(to right,#5e17eb,#8c52ff,#f5a623); }
  .bg-glow  { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); width:1200px; height:1200px; border-radius:50%; background:radial-gradient(circle,rgba(94,23,235,0.32) 0%,transparent 65%); z-index:0; }
  .bg-glow2 { position:absolute; bottom:160px; left:50%; transform:translateX(-50%); width:900px; height:500px; background:radial-gradient(ellipse,rgba(245,166,35,0.11) 0%,transparent 65%); z-index:0; }
  .bg-scanlines { position:absolute; inset:0; background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px); z-index:1; }

  .corner { position:absolute; width:72px; height:72px; z-index:3; }
  .corner-tl { top:44px; left:44px; border-top:2px solid rgba(140,82,255,0.35); border-left:2px solid rgba(140,82,255,0.35); }
  .corner-tr { top:44px; right:44px; border-top:2px solid rgba(140,82,255,0.35); border-right:2px solid rgba(140,82,255,0.35); }
  .corner-bl { bottom:44px; left:44px; border-bottom:2px solid rgba(140,82,255,0.35); border-left:2px solid rgba(140,82,255,0.35); }
  .corner-br { bottom:44px; right:44px; border-bottom:2px solid rgba(140,82,255,0.35); border-right:2px solid rgba(140,82,255,0.35); }

  .brand  { position:absolute; top:36px; left:80px; font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:6px; color:rgba(255,255,255,0.28); z-index:10; }
  .season { position:absolute; top:40px; right:80px; font-size:17px; font-weight:700; letter-spacing:5px; color:rgba(255,255,255,0.20); text-transform:uppercase; z-index:10; }

  .slide { position:relative; z-index:2; width:1080px; height:1920px; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  .seed-badge { background:rgba(140,82,255,0.15); border:1.5px solid rgba(140,82,255,0.50); border-radius:100px; padding:14px 36px; margin-bottom:60px; }
  .seed-badge-text { font-size:20px; font-weight:700; letter-spacing:6px; color:#8c52ff; text-transform:uppercase; }

  .logos-row { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:56px; }
  .team-block { display:flex; flex-direction:column; align-items:center; gap:20px; width:340px; }
  .team-logo  { width:260px; height:260px; object-fit:contain; filter:drop-shadow(0 0 40px rgba(140,82,255,0.45)); }
  .team-code  { font-family:'Bebas Neue',sans-serif; font-size:72px; letter-spacing:6px; color:#fff; }
  .team-label { font-size:18px; font-weight:700; letter-spacing:4px; color:rgba(255,255,255,0.35); text-transform:uppercase; }

  .vs-block { display:flex; flex-direction:column; align-items:center; gap:8px; width:100px; }
  .vs-text { font-family:'Bebas Neue',sans-serif; font-size:52px; color:rgba(255,255,255,0.18); }
  .vs-line { width:1px; height:180px; background:rgba(255,255,255,0.10); }

  .neon-rule { width:220px; height:3px; background:linear-gradient(90deg,transparent,#8c52ff,transparent); border-radius:2px; box-shadow:0 0 16px rgba(140,82,255,0.6); margin-bottom:44px; }

  .headline { font-family:'Bebas Neue',sans-serif; font-size:100px; letter-spacing:4px; color:#fff; text-align:center; line-height:0.90; margin-bottom:20px; }
  .headline span { color:#8c52ff; }
  .subline  { font-size:24px; font-weight:700; letter-spacing:6px; color:rgba(255,255,255,0.38); text-align:center; text-transform:uppercase; }

  .footer { position:absolute; bottom:52px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 80px; z-index:10; }
  .footer-brand  { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:4px; color:rgba(255,255,255,0.12); }
  .footer-season { font-size:15px; font-weight:600; letter-spacing:3px; color:rgba(255,255,255,0.12); text-transform:uppercase; }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="bg-scanlines"></div>
<div class="corner corner-tl"></div><div class="corner corner-tr"></div>
<div class="corner corner-bl"></div><div class="corner corner-br"></div>
<div class="brand">BTN</div>
<div class="season">PWHL &#xB7; Season 8</div>

<div class="slide">
  <div class="seed-badge">
    <div class="seed-badge-text">2nd Seed vs 3rd Seed</div>
  </div>

  <div class="logos-row">
    <div class="team-block">
      <img class="team-logo" src="{{ ott_logo }}" alt="OTT">
      <div class="team-code">OTT</div>
      <div class="team-label">Ottawa</div>
    </div>
    <div class="vs-block">
      <div class="vs-line"></div>
      <div class="vs-text">VS</div>
      <div class="vs-line"></div>
    </div>
    <div class="team-block">
      <img class="team-logo" src="{{ bos_logo }}" alt="BOS">
      <div class="team-code">BOS</div>
      <div class="team-label">Boston</div>
    </div>
  </div>

  <div class="neon-rule"></div>
  <div class="headline">OTT VS<br><span>BOSTON</span></div>
  <div class="subline">The other side of the bracket</div>
</div>

<div class="footer">
  <div class="footer-brand">BY THE NUMBERS</div>
  <div class="footer-season">Season 8 &#xB7; 2025&#x2013;26</div>
</div>
</body>
</html>
